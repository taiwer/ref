<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <!-- 背景：纯净纯白 -->
  <rect width="1200" height="700" fill="#FFFFFF"/>

  <!-- ================= 顶部主标题区域 ================= -->
  <!-- 左侧发散光芒线 -->
  <g stroke="#0F294A" stroke-width="4.5" stroke-linecap="round">
    <line x1="220" y1="85" x2="250" y2="70"/>
    <line x1="205" y1="110" x2="245" y2="110"/>
    <line x1="220" y1="135" x2="250" y2="150"/>
  </g>

  <!-- 主标题：特大加粗深蓝黑字体 -->
  <text x="600" y="125" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="62" fill="#0A1E3F" letter-spacing="4">
    什么是统计学？
  </text>

  <!-- 右侧发散光芒线 -->
  <g stroke="#0F294A" stroke-width="4.5" stroke-linecap="round">
    <line x1="980" y1="85" x2="950" y2="70"/>
    <line x1="995" y1="110" x2="955" y2="110"/>
    <line x1="980" y1="135" x2="950" y2="150"/>
  </g>

  <!-- 蓝色系分割线与中心圆点 -->
  <line x1="320" y1="165" x2="880" y2="165" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="600" cy="165" r="5.5" fill="#0284C7"/>

  <!-- 副标题：纯黑加粗大字 + 鲜明蓝色箭头 -->
  <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="24" fill="#000000">
    <text x="260" y="208" text-anchor="middle">收集</text>
    <text x="325" y="208" text-anchor="middle" font-size="24" fill="#0284C7">→</text>
    
    <text x="390" y="208" text-anchor="middle">处理</text>
    <text x="455" y="208" text-anchor="middle" font-size="24" fill="#0284C7">→</text>
    
    <text x="520" y="208" text-anchor="middle">分析</text>
    <text x="585" y="208" text-anchor="middle" font-size="24" fill="#0284C7">→</text>
    
    <text x="650" y="208" text-anchor="middle">解释</text>
    <text x="715" y="208" text-anchor="middle" font-size="24" fill="#0284C7">→</text>
    
    <text x="850" y="208" text-anchor="middle">得出结论的科学</text>
  </g>

  <!-- ================= 卡片 1: 收集数据 ================= -->
  <g transform="translate(45, 275)">
    <!-- 卡片主体外框 -->
    <rect width="195" height="355" rx="24" fill="#F0F9FF" stroke="#38BDF8" stroke-width="2.5"/>
    
    <!-- 顶部数字标号圆圈 -->
    <circle cx="97.5" cy="-24" r="24" fill="#0284C7"/>
    <text x="97.5" y="-14" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="24" fill="#FFFFFF">1</text>
    
    <!-- 图标：数据库与清单 -->
    <g transform="translate(48, 15)" stroke="#0284C7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <ellipse cx="32" cy="16" rx="24" ry="8"/>
      <path d="M 8 16 v 16 c 0 4.5 10.7 8 24 8"/>
      <path d="M 8 32 v 16 c 0 4.5 10.7 8 24 8"/>
      <!-- 清单 -->
      <path d="M 36 34 h 30 v 52 h -36 v -44 z" fill="#FFFFFF"/>
      <line x1="45" y1="48" x2="58" y2="48"/>
      <line x1="45" y1="60" x2="58" y2="60"/>
      <line x1="45" y1="72" x2="58" y2="72"/>
    </g>

    <!-- 中部步骤解释文字（大字号、纯黑无灰色） -->
    <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="800" font-size="18" fill="#0A1E3F">
      <text x="97.5" y="145" text-anchor="middle">抽样调查</text>
      <text x="97.5" y="175" text-anchor="middle">科学设计实验</text>
      <text x="97.5" y="205" text-anchor="middle">获取可靠样本</text>
    </g>

    <!-- 底部核心名称容器 -->
    <rect y="260" width="195" height="95" rx="20" fill="#E0F2FE"/>
    <rect y="260" width="195" height="25" fill="#E0F2FE"/>
    <text x="97.5" y="306" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-weight="900" font-size="27" fill="#0369A1">
      收集数据
    </text>
    <line x1="62" y1="324" x2="132" y2="324" stroke="#0369A1" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- 连接箭头 1->2 -->
  <g transform="translate(248, 440)" fill="#0284C7">
    <polygon points="12,0 0,-12 0,12"/>
  </g>

  <!-- ================= 卡片 2: 处理数据 ================= -->
  <g transform="translate(275, 275)">
    <rect width="195" height="355" rx="24" fill="#F0F9FF" stroke="#38BDF8" stroke-width="2.5"/>
    
    <circle cx="97.5" cy="-24" r="24" fill="#0284C7"/>
    <text x="97.5" y="-14" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="24" fill="#FFFFFF">2</text>
    
    <!-- 图标：扫帚打扫数据尘埃 -->
    <g transform="translate(48, 15)" stroke="#0284C7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="60" y1="10" x2="40" y2="50"/>
      <path d="M 40 50 L 20 68 C 16 85 40 92 56 80 L 48 50 Z" fill="#FFFFFF"/>
      <line x1="25" y1="78" x2="35" y2="70"/>
      <!-- 数据方块 -->
      <rect x="65" y="65" width="7" height="18" fill="#0284C7"/>
      <rect x="76" y="52" width="7" height="31" fill="#0284C7"/>
      <rect x="14" y="28" width="6" height="6" fill="#0284C7"/>
    </g>

    <!-- 中部步骤解释文字 -->
    <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="800" font-size="18" fill="#0A1E3F">
      <text x="97.5" y="145" text-anchor="middle">清洗异常数据</text>
      <text x="97.5" y="175" text-anchor="middle">填补处理缺失</text>
      <text x="97.5" y="205" text-anchor="middle">规范结构排列</text>
    </g>

    <!-- 底部核心名称容器 -->
    <rect y="260" width="195" height="95" rx="20" fill="#E0F2FE"/>
    <rect y="260" width="195" height="25" fill="#E0F2FE"/>
    <text x="97.5" y="306" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-weight="900" font-size="27" fill="#0369A1">
      处理数据
    </text>
    <line x1="62" y1="324" x2="132" y2="324" stroke="#0369A1" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- 连接箭头 2->3 -->
  <g transform="translate(478, 440)" fill="#0284C7">
    <polygon points="12,0 0,-12 0,12"/>
  </g>

  <!-- ================= 卡片 3: 分析数据 ================= -->
  <g transform="translate(505, 275)">
    <rect width="195" height="355" rx="24" fill="#F0F9FF" stroke="#38BDF8" stroke-width="2.5"/>
    
    <circle cx="97.5" cy="-24" r="24" fill="#0284C7"/>
    <text x="97.5" y="-14" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="24" fill="#FFFFFF">3</text>
    
    <!-- 图标：散点图与回归线 -->
    <g transform="translate(46, 18)" stroke="#0284C7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="15" y1="12" x2="15" y2="78"/>
      <line x1="15" y1="78" x2="80" y2="78"/>
      <line x1="15" y1="70" x2="72" y2="22"/>
      <circle cx="30" cy="32" r="2.5" fill="#0284C7"/>
      <circle cx="48" cy="52" r="2.5" fill="#0284C7"/>
      <circle cx="62" cy="38" r="2.5" fill="#0284C7"/>
      <!-- Sigma -->
      <path d="M 68 70 h 14 l -10 10 l 10 10 h -14" stroke-width="3"/>
    </g>

    <!-- 中部步骤解释文字 -->
    <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="800" font-size="18" fill="#0A1E3F">
      <text x="97.5" y="145" text-anchor="middle">探索分布特征</text>
      <text x="97.5" y="175" text-anchor="middle">参数推断估计</text>
      <text x="97.5" y="205" text-anchor="middle">构建统计模型</text>
    </g>

    <!-- 底部核心名称容器 -->
    <rect y="260" width="195" height="95" rx="20" fill="#E0F2FE"/>
    <rect y="260" width="195" height="25" fill="#E0F2FE"/>
    <text x="97.5" y="306" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-weight="900" font-size="27" fill="#0369A1">
      分析数据
    </text>
    <line x1="62" y1="324" x2="132" y2="324" stroke="#0369A1" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- 连接箭头 3->4 -->
  <g transform="translate(708, 440)" fill="#0284C7">
    <polygon points="12,0 0,-12 0,12"/>
  </g>

  <!-- ================= 卡片 4: 解释数据 ================= -->
  <g transform="translate(735, 275)">
    <rect width="195" height="355" rx="24" fill="#F0F9FF" stroke="#38BDF8" stroke-width="2.5"/>
    
    <circle cx="97.5" cy="-24" r="24" fill="#0284C7"/>
    <text x="97.5" y="-14" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="24" fill="#FFFFFF">4</text>
    
    <!-- 图标：灯泡与齿轮 -->
    <g transform="translate(54, 15)" stroke="#0284C7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 24 45 C 8 35 10 12 28 12 C 46 12 48 35 32 45 L 30 56 H 26 Z" fill="#FFFFFF"/>
      <line x1="26" y1="62" x2="30" y2="62"/>
      <line x1="28" y1="4" x2="28" y2="8"/>
      <line x1="8" y1="18" x2="12" y2="21"/>
      <line x1="48" y1="18" x2="44" y2="21"/>
      <circle cx="28" cy="28" r="5" stroke-width="3"/>
    </g>

    <!-- 中部步骤解释文字 -->
    <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="800" font-size="18" fill="#0A1E3F">
      <text x="97.5" y="145" text-anchor="middle">阐释统计量含义</text>
      <text x="97.5" y="175" text-anchor="middle">评估显著性效果</text>
      <text x="97.5" y="205" text-anchor="middle">联系现实业务</text>
    </g>

    <!-- 底部核心名称容器 -->
    <rect y="260" width="195" height="95" rx="20" fill="#E0F2FE"/>
    <rect y="260" width="195" height="25" fill="#E0F2FE"/>
    <text x="97.5" y="306" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-weight="900" font-size="27" fill="#0369A1">
      解释数据
    </text>
    <line x1="62" y1="324" x2="132" y2="324" stroke="#0369A1" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- 连接箭头 4->5 -->
  <g transform="translate(938, 440)" fill="#0284C7">
    <polygon points="12,0 0,-12 0,12"/>
  </g>

  <!-- ================= 卡片 5: 得出结论 ================= -->
  <g transform="translate(965, 275)">
    <rect width="195" height="355" rx="24" fill="#F0F9FF" stroke="#38BDF8" stroke-width="2.5"/>
    
    <circle cx="97.5" cy="-24" r="24" fill="#0284C7"/>
    <text x="97.5" y="-14" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="24" fill="#FFFFFF">5</text>
    
    <!-- 图标：靶盘与飞箭 -->
    <g transform="translate(50, 16)" stroke="#0284C7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="40" cy="48" r="34"/>
      <circle cx="40" cy="48" r="20"/>
      <circle cx="40" cy="48" r="10" fill="#0284C7"/>
      <path d="M 36 48 L 39 51 L 44 45" stroke="#FFFFFF" stroke-width="2.5"/>
      <line x1="58" y1="28" x2="80" y2="6"/>
      <path d="M 72 6 L 80 6 L 80 14"/>
    </g>

    <!-- 中部步骤解释文字 -->
    <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="800" font-size="18" fill="#0A1E3F">
      <text x="97.5" y="145" text-anchor="middle">验证科学假设</text>
      <text x="97.5" y="175" text-anchor="middle">归纳规律洞见</text>
      <text x="97.5" y="205" text-anchor="middle">驱动科学决策</text>
    </g>

    <!-- 底部核心名称容器 -->
    <rect y="260" width="195" height="95" rx="20" fill="#E0F2FE"/>
    <rect y="260" width="195" height="25" fill="#E0F2FE"/>
    <text x="97.5" y="306" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-weight="900" font-size="27" fill="#0369A1">
      得出结论
    </text>
    <line x1="62" y1="324" x2="132" y2="324" stroke="#0369A1" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
